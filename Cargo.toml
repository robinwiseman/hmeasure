[package]
name = "hmeasure"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Rust implementation of the H-Measure for assessing binary classifiers."
homepage = "https://github.com/robinwiseman/hmeasure"
repository = "https://github.com/robinwiseman/hmeasure"
readme = "README.md"
keywords = ["classifier", "H-Measure", "AUC", "ROC"]
authors = ["Robin D. Wiseman"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Generators of reproducible dummy classifier scores, for tests, examples and benchmarks.
datagen = ["dep:rand", "dep:rand_chacha", "statrs/rand"]

[dependencies]
quadrature = "0.1.2"
rand = { version = "0.10.3", optional = true }
rand_chacha = { version = "0.10.0", optional = true }
statrs = { version = "0.19.1", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = "0.8.2"
# Enables the datagen feature for this crate's own tests, examples and benchmarks.
hmeasure = { path = ".", features = ["datagen"] }

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "performance_benchmark"
harness = false
required-features = ["datagen"]

[[example]]
name = "monotonic"
required-features = ["datagen"]

[[test]]
name = "hmeasure"
required-features = ["datagen"]
